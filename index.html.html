function groupGrade(aid,g,val){
 const a=S.ac.find(x=>x.id==aid);if(!a)return;a.gsc=a.gsc||{};a.del=a.del||{};
 if(String(val).trim()===''){delete a.gsc[g];save();trk(aid);return}
 const v=parseFloat(String(val).replace(',','.'));if(isNaN(v)||v<LO()||v>MX())return tt(`La nota debe estar entre ${f(LO())} y ${f(MX())}.`);
 a.gsc[g]=v;const ms=sg().filter(s=>s.grp==g);
 ms.forEach(s=>{const old=a.cn[s.id]||0,c=coin(a,v);s.c+=c-old;xpAct(a,s);a.cn[s.id]=c;a.sc[s.id]=v;a.del[s.id]=true;delete a.jf?.[s.id]});
 log(`Asignaste nota grupal ${f(v)} a «${g}» en «${a.name}»`);save();trk(aid);tt('Nota grupal guardada para todo el grupo y marcada como entregada.');
}

function jOne(aid,i,v){
 const a=S.ac.find(x=>x.id==aid),s=sid(i);if(!a||!s)return;
 a.jf=a.jf||{};a.del=a.del||{};
 if(v){
   a.jf[i]=v;a.del[i]=false;
   const old=a.cn?.[i]||0;s.c-=old;s.xp-=old;delete a.sc?.[i];delete a.cn?.[i];
 }else{
   delete a.jf[i];
 }
 save();trk(aid);tt(v?`${s.n} volvió a Pendientes (${v}).`:'Estado actualizado.');
}

/* ===== Avatar: prendas por categoría + capas reales ===== */
function avatarNormalizeState(){
  S.avatarItems=S.avatarItems||[]; S.avatarBases=S.avatarBases||[];
  const first=S.avatarBases[0]?.id;
  S.avatarItems.forEach(a=>{
    if(a.avatarId==null||a.avatarId==='') a.avatarId=first||'';
    if(!Number.isFinite(+a.layer)) a.layer=5;
  });
  S.st.forEach(s=>{
    s.avatarEq=s.avatarEq||{};
    /* Migración de la versión anterior: items[] -> una sola prenda por categoría. */
    if(Array.isArray(s.avatarEq.items)){
      const ids=s.avatarEq.items.slice(); s.avatarEq={...s.avatarEq};
      delete s.avatarEq.items;
      ids.forEach(id=>{const a=S.avatarItems.find(x=>x.id==id);if(a)s.avatarEq[a.category]=a.id;});
    }
  });
}
function avatarEquip(id){
  const s=me(),a=(S.avatarItems||[]).find(x=>x.id==id);
  if(!s||!a||!avatarEligible(s,a))return;
  const b=avatarSelectedBase(s);
  if(String(a.avatarId)!==String(b?.id))return tt('Este artículo pertenece a otro avatar.');
  s.avatarEq=s.avatarEq||{};
  if(s.avatarEq[a.category]===a.id) delete s.avatarEq[a.category];
  else s.avatarEq[a.category]=a.id; // una sola prenda activa por apartado/categoría
  save();render();
}
function avatarRender(s,size=220){
  const b=avatarSelectedBase(s),items=(S.avatarItems||[]).filter(a=>String(a.avatarId)===String(b?.id)&&avatarEligible(s,a));
  const eq=s.avatarEq||{},layers=[];
  if(b?.bodyImg)layers.push({z:Number(b.bodyLayer??3),src:b.bodyImg,alt:'Cuerpo'});
  else if(b?.img)layers.push({z:Number(b.bodyLayer??3),src:b.img,alt:'Avatar'});
  if(b?.headImg)layers.push({z:Number(b.headLayer??6),src:b.headImg,alt:'Cabeza'});
  items.forEach(a=>{if(eq[a.category]===a.id&&a.img)layers.push({z:Number(a.layer??5),src:a.img,alt:a.name,filter:avatarFilterColor(eq[a.id+'_color'])});});
  layers.sort((a,b)=>a.z-b.z);
  return `<div class="avatar-stage" style="width:${size}px;height:${Math.round(size*1.22)}px">${layers.map(x=>`<img class="avatar-layer" src="${x.src}" style="z-index:${Math.max(1,Math.min(999,x.z))};${x.filter?`filter:${x.filter}`:''}" alt="${esc(x.alt||'')}">`).join('')||`<div class="avatar-fallback">${s.sx==='Femenino'?'👧':'👦'}</div>`}</div>`;
}
function avatarCustomizer(){
  const s=me(),b=avatarSelectedBase(s),items=(S.avatarItems||[]).filter(a=>String(a.avatarId)===String(b?.id)&&avatarEligible(s,a)),eq=s.avatarEq||{};

function xlsxNorm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
async function zipEntries(file){
  const buf=await file.arrayBuffer(),dv=new DataView(buf),u8=new Uint8Array(buf);let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65558);i--)if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}
  if(eocd<0)throw new Error('No parece ser un archivo XLSX válido.');
  const cdOff=dv.getUint32(eocd+16,true),count=dv.getUint16(eocd+10,true),out={};let p0=cdOff;
  for(let i=0;i<count;i++){
    if(dv.getUint32(p0,true)!==0x02014b50)break;
    const method=dv.getUint16(p0+10,true),cs=dv.getUint32(p0+20,true),fnl=dv.getUint16(p0+28,true),exl=dv.getUint16(p0+30,true),coml=dv.getUint16(p0+32,true),loc=dv.getUint32(p0+42,true),name=new TextDecoder().decode(u8.slice(p0+46,p0+46+fnl));
    const lfn=dv.getUint16(loc+26,true),lex=dv.getUint16(loc+28,true),start=loc+30+lfn+lex,raw=u8.slice(start,start+cs);let data;
    if(method===0)data=raw;else if(method===8){if(typeof DecompressionStream==='undefined')throw new Error('Este navegador no permite descomprimir XLSX.');const ds=new DecompressionStream('deflate-raw');data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer());}else throw new Error('Compresión XLSX no compatible.');
    out[name]=data;p0+=46+fnl+exl+coml+dv.getUint16(p0+34,true);
  }return out;
}
function xmlDoc(bytes){return new DOMParser().parseFromString(new TextDecoder().decode(bytes),'application/xml')}
async function xlsxRows(file){
  const z=await zipEntries(file),shared=[];
  if(z['xl/sharedStrings.xml'])xmlDoc(z['xl/sharedStrings.xml']).querySelectorAll('si').forEach(si=>shared.push([...si.querySelectorAll('t')].map(x=>x.textContent).join('')));
  const names=Object.keys(z).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort();if(!names.length)throw new Error('El Excel no contiene una hoja de datos.');
  const d=xmlDoc(z[names[0]]),rows=[];
  d.querySelectorAll('row').forEach(r=>{const vals=[];r.querySelectorAll(':scope > c').forEach(c=>{const t=c.getAttribute('t'),v=c.querySelector('v'),is=c.querySelector('is');let x=v?v.textContent:(is?[...is.querySelectorAll('t')].map(q=>q.textContent).join(''):'');if(t==='s')x=shared[+x]??x;else if(t==='b')x=x==='1'?'Sí':'No';vals.push(x)});rows.push(vals)});return rows;
}
function studentSex(v){const x=xlsxNorm(v);if(['f','fem','femenino','female','mujer','2'].includes(x))return'Femenino';if(['m','mas','masculino','male','hombre','1'].includes(x))return'Masculino';return String(v||'').trim()||'No especificado'}
async function importStudentsExcel(input){
  const file=input.files?.[0];if(!file)return;try{
    const ext=(file.name.split('.').pop()||'').toLowerCase();let rows;
    if(ext==='xlsx')rows=await xlsxRows(file);else{const txt=await file.text();rows=txt.trim().split(/\r?\n/).map(r=>r.split(/[;,\t]/));}
    if(!rows.length)throw new Error('El archivo está vacío.');
    const h=rows[0].map(xlsxNorm),findH=(...names)=>{const i=h.findIndex(x=>names.some(n=>x===n||x.includes(n)));return i};
    const ni=findH('numerodelista','lista','numero'),nn=findH('nombredelestudiante','nombrecompleto','nombre'),nx=findH('sexo','genero','genero');
    if(nn<0||ni<0||nx<0)throw new Error('La primera fila debe contener al menos: Número de lista, Nombre del estudiante y Sexo.');
    const ig=findH('grupo'),igr=findH('grado','curso');let made=0,skip=0;
    for(const row of rows.slice(1)){
      const n=String(row[nn]??'').trim(),num=String(row[ni]??'').trim();if(!n||!num){skip++;continue}
      const g=(igr>=0&&row[igr])?String(row[igr]).trim():S.g;if(igr>=0&&String(g)!==String(S.g))continue;
      const grp=ig>=0&&row[ig]?String(row[ig]).trim():'Sin grupo';

      let id=Date.now()+made;while(S.st.some(s=>s.id===id))id++;
      S.st.push({id,n,num,g,grp:grp||'Sin grupo',sx:studentSex(row[nx]),c:0,xp:0,it:[],pub:'',priv:'',u:uname(n),pin:pin(),inv:[],eq:0,avatarEq:{}});made++;
    }
    save();render();tt(`Importación terminada: ${made} estudiantes creados${skip?`, ${skip} omitidos`:''}.`);
  }catch(e){console.error(e);tt('No se pudo importar: '+e.message)}finally{input.value=''}
}

function avatarEligibleForBase(s,a,b){
  if(!a)return false;
  if(String(a.avatarId)!==String(b?.id))return false;
  if(a.gender&&a.gender!=='Todos'&&s?.sx&&a.gender!==s.sx)return false;
  return !(+a.xp>0 && (+s?.xp||0)<+a.xp);
}

/* ===== Corrección definitiva: desbloqueo/selección de avatares + preview ===== */
function avatarBaseUnlocked(s,b){
  return !!b && (b.gender==='Todos'||b.gender===s?.sx||!s?.sx) && Number(s?.xp||0)>=Number(b.xp||0);
}
function avatarSelectedBase(s){
  const bs=(S.avatarBases||[]).filter(b=>avatarBaseUnlocked(s,b));
  return bs.find(b=>String(b.id)===String(s?.avatarId))||bs.find(b=>b.gender===s?.sx)||bs[0];
}
function avatarEligibleForBase(s,a,b){
  if(!a||!b||String(a.avatarId)!==String(b.id))return false;
  if(!avatarBaseUnlocked(s,b))return false;
  if(a.gender&&a.gender!=='Todos'&&s?.sx&&a.gender!==s.sx)return false;
  return Number(s?.xp||0)>=Number(a.xp||0);
}
function avatarEligible(s,a){
  const b=(S.avatarBases||[]).find(x=>String(x.id)===String(a?.avatarId));
  return avatarEligibleForBase(s,a,b);
}
function avatarChooseBase(id){
  const s=me(),b=(S.avatarBases||[]).find(x=>String(x.id)===String(id));
  if(!s||!avatarBaseUnlocked(s,b))return tt('Este avatar todavía no está desbloqueado para ti.');
  s.avatarId=b.id;s.avatarEq={};save();render();
}
function avatarEditorChooseBase(id){
  const s=me(),b=(S.avatarBases||[]).find(x=>String(x.id)===String(id));
  if(!s||!avatarBaseUnlocked(s,b))return tt('Todavía no tienes suficiente XP para usar este avatar.');
  s.avatarId=b.id;s.avatarEq={};window.STU_AVATAR_EDITOR={baseId:b.id,eq:{}};save();avatarEditStudentRender();
}

function avatarBaseSave(id){
 const n=$('#abn')?.value.trim(),g=$('#abg')?.value,b=(S.avatarBases||[]).find(x=>x.id==id);if(!n)return tt('Escribe el nombre.');
 const files=[['abh','headImg'],['abb','bodyImg'],['abf','img']],out={name:n,gender:g,xp:Math.max(0,+$('#abx').value||0),headLayer:Math.max(0,Math.min(999,parseInt($('#abhl').value,10)||1)),bodyLayer:Math.max(0,Math.min(999,parseInt($('#abbl').value,10)||3))};
 let pending=files.filter(([i])=>$('#'+i)?.files?.[0]).length;
 const done=()=>{S.avatarBases=S.avatarBases||[];if(b)Object.assign(b,out);else S.avatarBases.push({id:Date.now(),...out});save();cx();render();tt('Avatar guardado.')};
 if(!pending)return done();files.forEach(([i,k])=>{const el=$('#'+i);if(!el?.files?.[0])return;assetDataURL(el,d=>{out[k]=d;if(--pending===0)done()})});
}

 const ctx=window.STU_AVATAR_EDITOR||{};ctx.baseId=b.id;ctx.eq={...(ctx.eq||s.avatarEq||{})};
 if(ctx.eq[a.category]===a.id)delete ctx.eq[a.category];else ctx.eq[a.category]=a.id;
 s.avatarId=b.id;s.avatarEq={...ctx.eq};window.STU_AVATAR_EDITOR=ctx;save();avatarEditStudentRender();

 s.avatarEq=s.avatarEq||{};if(s.avatarEq[a.category]===a.id)delete s.avatarEq[a.category];else s.avatarEq[a.category]=a.id;save();render();

function avatarRender(s,size=220){
 const b=avatarSelectedBase(s),eq=s?.avatarEq||{},layers=[];
 if(b?.bodyImg)layers.push({z:Number(b.bodyLayer??3),src:b.bodyImg,alt:'Cuerpo'});else if(b?.img)layers.push({z:Number(b.bodyLayer??3),src:b.img,alt:'Avatar'});
 if(b?.headImg)layers.push({z:Number(b.headLayer??1),src:b.headImg,alt:'Cabeza'});
 (S.avatarItems||[]).filter(a=>avatarEligibleForBase(s,a,b)&&eq[a.category]===a.id&&a.img).forEach(a=>layers.push({z:Number(a.layer??5),src:a.img,alt:a.name,filter:avatarFilterColor(eq[a.id+'_color'])}));
 layers.sort((a,b)=>a.z-b.z);
 return `<div class="avatar-stage" style="width:${size}px;height:${Math.round(size*1.22)}px">${layers.map(x=>`<img class="avatar-layer" src="${x.src}" style="z-index:${Math.max(1,Math.min(999,x.z))};${x.filter?`filter:${x.filter}`:''}" alt="${esc(x.alt||'')}">`).join('')||`<div class="avatar-fallback">${s?.sx==='Femenino'?'👧':'👦'}</div>`}</div>`;
}

function drFill(x,px,py){const W=360,H=440,im=x.getImageData(0,0,W,H),d=im.data,sx=Math.floor(px),sy=Math.floor(py);if(sx<0||sy<0||sx>=W||sy>=H)return;const i0=(sy*W+sx)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],c=hex2rgb(DR.c);if(t[0]==c[0]&&t[1]==c[1]&&t[2]==c[2]&&t[3]==255)return;const near=i=>Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])+Math.abs(d[i+3]-t[3])<=80,seen=new Uint8Array(W*H),st=[[sx,sy]];while(st.length){const[x0,y0]=st.pop();let xx=x0;while(xx>=0&&!seen[y0*W+xx]&&near((y0*W+xx)*4))xx--;xx++;let up=0,dn=0;while(xx<W&&!seen[y0*W+xx]&&near((y0*W+xx)*4)){seen[y0*W+xx]=1;const j=(y0*W+xx)*4;d[j]=c[0];d[j+1]=c[1];d[j+2]=c[2];d[j+3]=255;if(y0>0){const n=near(((y0-1)*W+xx)*4)&&!seen[(y0-1)*W+xx];if(n&&!up){st.push([xx,y0-1]);up=1}else if(!n)up=0}if(y0<H-1){const n=near(((y0+1)*W+xx)*4)&&!seen[(y0+1)*W+xx];if(n&&!dn){st.push([xx,y0+1]);dn=1}else if(!n)dn=0}xx++}}x.putImageData(im,0,0)}
function drImg(inp){const f=inp.files[0];if(!f)return;if(!f.type.startsWith('image/'))return tt('Elige una imagen.');const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const x=dcx();drSnap(x);const z=Math.min(360/m.width,440/m.height),w=m.width*z,h=m.height*z;x.globalCompositeOperation='source-over';x.drawImage(m,(360-w)/2,(440-h)/2,w,h);inp.value='';tt('Imagen cargada. Puedes dibujar encima, quitar el fondo claro o enviarla.')};m.src=r.result};r.readAsDataURL(f)}
const guideHtml=()=>avatarRender(me(),360).replace(/style="width:\d+px;height:\d+px"/,'style="width:100%;height:100%"');
function drGuide(){DR.g=!DR.g;const w=$('#dcw'),g=$('#dgd');if(w)w.classList.toggle('guide',DR.g);if(g)g.innerHTML=DR.g?guideHtml():'';const b=$('#dg_btn');if(b)b.classList.toggle('p',DR.g)}
try{if(S&&S.role)render()}catch(e){}

/* ===== Notificaciones recibidas por el docente ===== */
function tnPush(o){(S.tn=S.tn||[]).unshift({id:Date.now()+Math.random(),date:Date.now(),read:false,...o});S.tn=S.tn.slice(0,300)}
const tnUnread=()=>(S.tn||[]).filter(n=>!n.read).length;
let NF='in';
function notifs(){const L=(S.tn||[]).filter(n=>n.g===S.g),un=L.filter(n=>!n.read),rd=L.filter(n=>n.read),ic={entrega:'📤',dibujo:'🖍️',recompensa:'🎁'};
const card=n=>`<article class="sheet"><div class="rw"><h3>${ic[n.k]||'🔔'} ${esc(n.title)}</h3><small>${fd(n.date)}</small></div><p>${esc(n.message)}</p><div class="qa"><button class="btn p" onclick="tnOpen(${n.id})">Abrir</button><button class="btn" onclick="tnRead(${n.id},${n.read?0:1})">${n.read?'Marcar como no leída':'Marcar como leída'}</button><button class="btn dg" onclick="tnDel(${n.id})">Eliminar</button></div></article>`;
const bar=`<div class="tabs"><button class="btn${NF=='in'?' p':''}" onclick="NF='in';render()">📥 Recibidas${un.length?` <span class="nbadge">${un.length}</span>`:''}</button><button class="btn${NF=='out'?' p':''}" onclick="NF='out';render()">📤 Enviadas</button></div>`;
if(NF=='out')return bar+notifsOut();
return bar+hd('Notificaciones','Entregas de actividades, dibujos y recompensas por aprobar.')+`<div class="qa" style="margin-bottom:12px"><button class="btn" onclick="tnAll()">✓ Marcar todas como leídas</button></div><div class="notif-columns"><section class="sheet"><h3>🔵 Nuevas (${un.length})</h3><div class="stack">${un.map(card).join('')||'<p class="mt">No hay notificaciones nuevas.</p>'}</div></section><section class="sheet"><h3>✓ Leídas (${rd.length})</h3><div class="stack">${rd.map(card).join('')||'<p class="mt">Nada leído todavía.</p>'}</div></section></div>`}
const tnFind=id=>(S.tn||[]).find(n=>String(n.id)===String(id));
function tnRead(id,v){const n=tnFind(id);if(n){n.read=!!v;save();render()}}
function tnDel(id){S.tn=(S.tn||[]).filter(n=>String(n.id)!==String(id));save();render()}
function tnAll(){(S.tn||[]).forEach(n=>{if(n.g===S.g)n.read=true});save();render()}
function tnOpen(id){const n=tnFind(id);if(!n)return;n.read=true;save();if(n.k=='entrega'&&S.ac.some(a=>a.id==n.a)){go('act');trk(n.a)}else if(n.k=='dibujo')go('dibs');else go('rew')}
/* ===== Inventario del estudiante: todo lo pedido, con su estado ===== */
function sinv(){const s=me(),mine=S.cl.filter(c=>c.s==s.id).sort((a,b)=>b.id-a.id),vs=(s.inv||[]).map(i=>S.rw.find(r=>r.id==i)).filter(Boolean),st={pendiente:['⏳ Esperando aprobación','tg'],aprobada:['✅ Aprobada','tg ok']},today=dkey(new Date());return hd('Mi inventario','Todo lo que has pedido con tus monedas. Si tu docente no aprueba una recompensa, sigue aquí y puedes volver a usarla al día siguiente.')+`<div class="g2"><section class="sheet"><h3>🎁 Mis recompensas</h3>${mine.map(c=>{const r=S.rw.find(x=>x.id==c.r);if(!r)return '';if(c.st=='rechazada'){const can=dkey(new Date(c.rt||c.t))<today;return `<div class="row"><span>${ei(r.e)} <b>${esc(r.n)}</b><small>No aprobada el ${fd(c.rt||c.t)} · sigue siendo tuya y no se te quitan monedas${can?'':' · podrás usarla de nuevo mañana'}</small></span>${can?`<button class="btn p" onclick="useAgain(${c.id})">🎁 Usar de nuevo</button>`:'<span class="tg no">⏳ Disponible mañana</span>'}</div>`}const z=st[c.st]||st.pendiente;return `<div class="row"><span>${ei(r.e)} <b>${esc(r.n)}</b><small>${fd(c.t)}${c.by=='docente'?' · reclamada por tu docente':''}${c.again?' · vuelta a pedir':''}</small></span><span class="${z[1]}">${z[0]}</span></div>`}).join('')||'<p class="mt">Aquí aparecerán tus recompensas.</p>'}</section><section class="sheet"><h3>🧥 Mi vestuario</h3>${vs.map(r=>`<div class="row"><span>${ei(r.e)} ${esc(r.n)}</span><button class="btn${s.eq==r.id?' p':''}" onclick="equip(${r.id})">${s.eq==r.id?'Quitar':'Equipar'}</button></div>`).join('')||'<p class="mt">Compra vestuario en la tienda para tu avatar.</p>'}</section></div>`}
function useAgain(id){const s=me(),c=S.cl.find(x=>x.id==id&&x.s==s.id);if(!c||c.st!='rechazada')return;if(dkey(new Date(c.rt||c.t))>=dkey(new Date()))return tt('Podrás volver a usarla mañana.');const r=S.rw.find(x=>x.id==c.r);c.st='pendiente';c.t=ts();c.again=(c.again||0)+1;tnPush({k:'recompensa',s:s.id,g:s.g,ref:c.id,title:'Recompensa por aprobar',message:`${s.n} volvió a pedir «${r?r.n:''}»`});log(`${s.n} volvió a pedir «${r?r.n:''}»`);ev(s.id,'tienda',`Volvió a usar «${r?r.n:''}»`);save();render();tt('Solicitud enviada otra vez a tu docente.')}
/* ===== Dibujo: rehacer ===== */
function drSnap(x){DR.u.push(x.getImageData(0,0,360,440));if(DR.u.length>20)DR.u.shift();DR.r=[]}
function drRedo(){const x=dcx(),r=(DR.r||[]).pop();if(x&&r){DR.u.push(x.getImageData(0,0,360,440));x.putImageData(r,0,0)}}
function dot(x){return /\.$/.test(x)?x:x+'.'}
/* ===== No saltar al inicio al refrescar ===== */
const _render=render;let LRP=P;
render=function(){const m=document.querySelector('.main'),same=LRP===P,y=m?m.scrollTop:0,wy=window.scrollY||0;_render.apply(this,arguments);LRP=P;if(same){const m2=document.querySelector('.main');if(m2)m2.scrollTop=y;if(wy)window.scrollTo(0,wy)}};
try{render()}catch(e){console.error(e)}
</script>
